<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flix AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>Flix AI</h1>
        <p>Your Smart AI Assistant</p>
    </header>

    <div id="chatBox" class="chat-box">

        <div class="bubble ai">
            Hello! I am Flix AI. How can I help you?
        </div>

    </div>

    <div class="input-area">

        <input
            id="prompt"
            type="text"
            placeholder="Ask Flix AI anything..."
            autocomplete="off"
        >

        <button id="sendBtn">
            Send
        </button>

        <button id="voiceBtn">
            🎤
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
