<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flix AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

        <h1>Flix AI</h1>

        <p>
            Your Smart AI Assistant
        </p>

        <button
            type="button"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>

    </header>


    <!-- ========================= -->
    <!-- CHAT BOX -->
    <!-- ========================= -->

    <div
        id="chatBox"
        class="chat-box"
    >

        <div class="bubble ai">

            Hello! I am Flix AI.
            How can I help you?

        </div>

    </div>


    <!-- ========================= -->
    <!-- INPUT AREA -->
    <!-- ========================= -->

    <div class="input-area">


        <input
            id="prompt"
            type="text"
            placeholder="Ask Flix AI anything..."
            autocomplete="off"
        >


        <button
            id="sendBtn"
            type="button"
        >
            Send
        </button>


        <button
            id="voiceBtn"
            type="button"
        >
            🎤
        </button>


    </div>


</div>


<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="script.js"></script>


</body>

</html>
